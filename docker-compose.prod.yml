# Production stack for a single Linux server: Postgres + MinIO + backend (NestJS) +
# frontend (Next.js). Plain HTTP (no TLS/reverse-proxy automation) - put Nginx/Caddy or
# Cloudflare in front later if/when you add a domain + TLS.
#
# backend/frontend run prebuilt images from GHCR (built + pushed by
# .github/workflows/deploy.yml), tagged with the exact git commit SHA - see
# deploy/remote-deploy.sh, which is what actually drives IMAGE_TAG and runs this file.
#
# Manual one-off bring-up (no CI): build+push the images yourself first, e.g.
#   docker build -t ghcr.io/sorez94/senseofstone-server:manual --build-arg GIT_SHA=manual ./server
#   docker push ghcr.io/sorez94/senseofstone-server:manual
#   IMAGE_TAG=manual docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Official minio/* images were removed from Docker Hub/quay.io; bitnamilegacy ships MinIO builds.
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    env_file: ./.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:9000:9000' # served publicly via nginx at /sos-uploads
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: bitnamilegacy/minio-client:latest
    env_file: ./.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done &&
      mc mb --ignore-existing local/sos-uploads &&
      mc anonymous set download local/sos-uploads
      "

  backend:
    image: ${SERVER_IMAGE:-ghcr.io/sorez94/senseofstone-server}:${IMAGE_TAG}
    restart: unless-stopped
    env_file: ./.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: sos-uploads
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    # NEXT_PUBLIC_* are baked into this image at build time (see .github/workflows/deploy.yml);
    # they can't be changed by env vars at this layer, only by rebuilding and redeploying.
    image: ${CLIENT_IMAGE:-ghcr.io/sorez94/senseofstone-client}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_IMAGE_HOSTS: ${NEXT_PUBLIC_IMAGE_HOSTS}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:
  minio-data:
