# Local development stack: Postgres + MinIO + the backend (hot-reloaded via ts-node-dev).
# The frontend is normally run on the host with `npm run dev` for fast HMR, pointing
# NEXT_PUBLIC_API_BASE_URL at http://localhost:4000/v1 (see client/.env.example).
#
# Usage:
#   cp server/.env.example server/.env   # then edit if needed
#   docker compose up -d --build
#   docker compose exec backend npx prisma migrate deploy
#   docker compose exec backend npm run seed

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sos
      POSTGRES_PASSWORD: sos
      POSTGRES_DB: sos
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sos -d sos']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/sos-uploads &&
      mc anonymous set download local/sos-uploads
      "

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    env_file: ./server/.env
    environment:
      # Overridden regardless of what's in .env: inside the compose network, Postgres/MinIO
      # are reached by service name, not localhost.
      DATABASE_URL: postgresql://sos:sos@postgres:5432/sos?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/sos-uploads
      CORS_ORIGINS: http://localhost:3000
    ports:
      - '4000:4000'
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  minio-data:
  server_node_modules:
